[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainwidemap"
version = "0.1.0"
description = "Analysis code for the IBL brain-wide map paper"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "International Brain Laboratory"}]
dependencies = [
    "ibllib>=2.26",
    "ONE-api>=2.5",
    "iblatlas>=0.3",
    "iblutil>=1.7",
    "numpy>=1.26,<2",
    "pandas>=2.1,<3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "python-dateutil>=2.8",
    "ipython>=8",
]

[project.urls]
Repository = "https://github.com/RaspLeoPi/paper-brain-wide-map"
Upstream = "https://github.com/int-brain-lab/paper-brain-wide-map"
Paper = "https://doi.org/10.1038/s41586-025-09235-0"

[dependency-groups]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5", "nbconvert>=7"]
dev = ["pytest>=8", "flake8>=6", "build>=1"]
decoding = ["behavior-models", "torch", "openturns", "scikit-learn>=1.3,<1.6", "tqdm"]
encoding = ["neurencoding>=0.1.8", "scikit-learn>=1.3,<1.6", "joblib", "tqdm", "seaborn"]
manifold = ["scikit-learn>=1.3,<1.6", "seaborn", "statsmodels"]
cluster = ["dask", "distributed", "dask-jobqueue"]

[tool.uv]
default-groups = []

[tool.uv.sources]
# Last installable revision retaining the models.expSmoothing_* namespace used here.
behavior-models = { git = "https://github.com/int-brain-lab/behavior_models.git", rev = "b314b7cca970e0c39eb42fdf5592fb6812657aef" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["brainwidemap*"]
exclude = ["brainwidemap.test*"]

[tool.setuptools.package-data]
brainwidemap = ["fixtures/*.csv"]

[tool.isort]
profile = "black"
known_first_party = ["ibllib", "iblutil", "one", "brainbox", "neurencoding"]
known_local_folder = ["brainwidemap"]
import_heading_stdlib = "Standard library"
import_heading_thirdparty = "Third party libraries"
import_heading_firstparty = "IBL libraries"
import_heading_localfolder = "Brainwidemap repo imports"
line_length = 99
wrap_length = 99

[tool.black]
line-length = 99
